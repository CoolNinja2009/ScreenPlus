<!doctype html>
<meta charset="utf-8">
<title>Depth wallpaper</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#bg,#c,#v{position:fixed;left:0;top:0;width:100%;height:100%}
#bg{background:url(__IMG__) center/cover no-repeat;transform:scale(1.0638)}
#v{object-fit:cover;transform:scale(1.0638)}
#c{opacity:0;transition:opacity .4s}
</style>
<div id="bg"></div><canvas id="c"></canvas>
<script>
/* Interactive depth wallpaper made by Screen+ ("Make wallpaper cooler"): the picture or video (__IMG__) is
 * shifted per pixel by a depth map (255 = nearest) with a parallax-occlusion raymarch, so near things slide
 * over far ones when the pointer moves. Plain WebGL2, no libraries. A picture's depth is __DEPTH__ and frames
 * are drawn only while something moves: an idle desktop costs no GPU time. A video's depth is __DEPTH__ too:
 * one small grey JPEG per depth frame (depth_infer.c's write_video), decoded a few frames ahead of playback;
 * each video frame is drawn with the two depth frames around its time blended. If WebGL2 or the files fail,
 * the plain picture or video stays.
 * Motion (pictures only): motion.png beside the page is three grey maps stacked top to bottom (sky, water,
 * plants; depth_infer.c's segment_picture). Plants sway and water ripples by sines of time; sky and water also
 * drift, which can't loop by itself, so the picture is pulled along the drift twice, half a cycle apart, and
 * the two cross-fade so the one that jumps back is never seen. With motion on, frames run continuously
 * (Screen+ suspends the page when it isn't seen); without motion.png the page stays still between moves. */
(function () {
  var VIDEO = __VIDEO__;
  var cv = document.getElementById('c'), bg = document.getElementById('bg'), vid = null;
  if (VIDEO) {
    bg.remove();
    vid = bg = document.createElement('video');
    vid.id = 'v';
    /* with its sound: Screen+ mutes the whole page unless Sound is on, and gives it to one display only */
    vid.loop = vid.autoplay = vid.playsInline = true;
    vid.src = '__IMG__';
    document.body.insertBefore(vid, cv);
    vid.play().catch(function () { vid.muted = true; vid.play(); });   /* autoplay refused with sound: at least the picture */
  }
  var gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false });
  if (!gl) return;
  var P = { strength: 40, autoMove: false, autoSpeed: 100, motion: true, motionSpeed: 100, wind: 60 };
  var MOTION = 0, clock = 0;
  window.livelyPropertyListener = function (n, v) {
    if (!(n in P)) return;
    P[n] = v;
    if (n === 'autoMove' && !v) tx = ty = 0;
    if (ready && !run) draw();               /* motion switched off: the still frame */
    kick();
  };
  function moving() { return MOTION && P.motion; }

  var VS = '#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}';
  var FS = '#version 300 es\nprecision highp float;\n' +
    'uniform sampler2D I,D,E,W;uniform vec2 R,M,K;uniform float S,N,F,T,A,G;out vec4 o;\n' +
    'float h(vec2 u){u=clamp(u,.001,.999);return mix(textureLod(D,u,0.).r,textureLod(E,u,0.).r,F);}\n' +
    'vec3 pic(vec2 u){return texture(I,clamp(u,.001,.999)).rgb;}\n' +
    'vec3 moved(vec2 u){\n' +                /* sky r, water g, plants b; T in cycles, A the amount */
    ' vec3 k=vec3(texture(W,vec2(u.x,2./3.+u.y/3.)).r,texture(W,vec2(u.x,1./3.+u.y/3.)).r,texture(W,vec2(u.x,u.y/3.)).r)*A;\n' +
    ' float t=T*6.2832;\n' +
    ' vec2 b=u+vec2(sin(t*.9+u.y*38.+u.x*9.)*.0016,sin(t*.6+u.x*31.)*.0008)*k.b\n' +
    '   +vec2(sin(t*1.3+u.y*160.+sin(u.x*40.+t*.5)*2.)*.0012,sin(t+u.x*120.)*.0018)*k.g;\n' +
    ' vec2 fl=vec2(G*.006,0.)*k.r+vec2(G*.006,-.004)*k.g;\n' +
    ' float p=fract(T),q=fract(T+.5);\n' +
    ' return mix(pic(b-fl*p),pic(b-fl*q),abs(1.-2.*p));}\n' +
    'void main(){\n' +
    ' vec2 st=(gl_FragCoord.xy/R-.5)*K+.5;\n' +
    ' vec2 off=-M*S,d=off/N,u=st-off*.5;\n' +
    ' float ls=1./N,l=1.,m=h(u);\n' +
    ' for(int i=0;i<40;i++){if(float(i)>=N||l<=m)break;u+=d;m=h(u);l-=ls;}\n' +
    ' float a=m-l,b=h(u-d)-(l+ls);\n' +
    ' u=mix(u,u-d,clamp(a/(a-b+1e-5),0.,1.));\n' +
    ' o=vec4(A>0.?moved(clamp(u,.001,.999)):pic(u),1.);}';
  function shader(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
  var pr = gl.createProgram();
  gl.attachShader(pr, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(pr, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  var U = {};
  ['I', 'D', 'E', 'W', 'R', 'M', 'K', 'S', 'N', 'F', 'T', 'A', 'G'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });
  gl.uniform1i(U.I, 0);
  gl.uniform1i(U.D, 1);
  gl.uniform1i(U.E, 2);
  gl.uniform1i(U.W, 3);
  gl.uniform1f(U.F, 0);
  gl.uniform1f(U.A, 0);

  var T = [];
  function tex(unit, mip) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, T[unit] = gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  function upload(unit, img, colour, mip) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, T[unit]);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, colour ? gl.BROWSER_DEFAULT_WEBGL : gl.NONE);
    if (colour) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gl.RED, gl.UNSIGNED_BYTE, img);
    if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  }
  tex(0, !VIDEO);
  tex(1, 0);
  tex(2, 0);
  tex(3, 0);

  var ready = 0, run = 0, last = 0, ph = 0, mx = 0, my = 0, tx = 0, ty = 0, iw = 1, ih = 1, kx = 1, ky = 1;
  function size() {
    var d = window.devicePixelRatio || 1, w = Math.max(1, Math.round(innerWidth * d)), h = Math.max(1, Math.round(innerHeight * d));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    var sa = w / h, ia = iw / ih;
    kx = Math.min(sa / ia, 1) * 0.94;    /* cover the screen, 6% closer so shifted pixels stay inside the picture */
    ky = Math.min(ia / sa, 1) * 0.94;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.R, w, h);
    gl.uniform2f(U.K, kx, ky);
  }
  function draw() {
    var s = P.strength / 100 * 0.075;
    var px = Math.hypot(mx * s / kx * cv.width, my * s / ky * cv.height);      /* shift in screen pixels */
    gl.uniform2f(U.M, mx, my);
    gl.uniform1f(U.S, s);
    gl.uniform1f(U.N, Math.max(4, Math.min(40, Math.ceil(px / 2.5))));         /* a step per ~2.5 px of shift */
    gl.uniform1f(U.A, moving() ? 1 : 0);
    gl.uniform1f(U.T, clock);
    gl.uniform1f(U.G, P.wind / 100);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function step(now) {                   /* the pointer's smoothing; true while it still moves */
    var dt = last ? Math.min((now - last) / 1000, 0.1) : 0.016;
    last = now;
    if (P.autoMove) {
      ph += dt * P.autoSpeed / 100;
      tx = Math.sin(ph * 1.2) * 0.75;
      ty = Math.cos(ph * 0.8) * 0.45;
    }
    var k = 1 - Math.exp(-dt * 5);
    mx += (tx - mx) * k;
    my += (ty - my) * k;
    if (moving()) clock = (clock + dt * P.motionSpeed / 100 / 4) % 1000;   /* a drift cycle is 4 s at 100% */
    return P.autoMove || moving() || Math.abs(tx - mx) > 5e-4 || Math.abs(ty - my) > 5e-4;
  }
  function frame(now) {
    run = 0;
    var moving = step(now);
    draw();
    if (moving) kick();
    else last = 0;
  }
  function kick() { if (ready && !run && !VIDEO) run = requestAnimationFrame(frame); }
  function aim(x, y) { tx = x; ty = y; kick(); }

  addEventListener('mousemove', function (e) {
    if (P.autoMove) return;
    var w = innerWidth, h = innerHeight;
    if (e.clientX < 0 || e.clientY < 0 || e.clientX > w || e.clientY > h) aim(0, 0);   /* Screen+ sends -16,-16 on leave */
    else aim((e.clientX / w - 0.5) * 2, -(e.clientY / h - 0.5) * 2);
  }, { passive: true });
  document.documentElement.addEventListener('mouseleave', function () { if (!P.autoMove) aim(0, 0); });
  addEventListener('resize', function () { if (ready) { size(); draw(); } });
  /* A lost GPU context (a paused page under memory pressure, a driver reset after a game): the plain picture
   * or video under the canvas shows at once, and a reload builds everything again: when Chromium restores the
   * context, or when the page is visible and it hasn't within a few seconds. */
  var lost = 0;
  function rebuild() { if (lost && !document.hidden) setTimeout(function () { if (lost && !document.hidden) location.reload(); }, 3000); }
  cv.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    lost = 1;
    cv.style.transition = 'none';
    cv.style.opacity = 0;
    rebuild();
  });
  cv.addEventListener('webglcontextrestored', function () { location.reload(); });
  document.addEventListener('visibilitychange', rebuild);
  /* shown again after a freeze: the canvas may have been dropped meanwhile, and a picture only draws on a move */
  function redraw() { if (ready && !lost && !document.hidden && !VIDEO) { size(); draw(); } }
  document.addEventListener('visibilitychange', redraw);
  document.addEventListener('resume', redraw);

  function show() {
    if (gl.getError()) return false;     /* e.g. a picture larger than the GPU allows: keep the plain one */
    ready = 1;
    size();
    draw();
    cv.style.opacity = 1;                /* the plain one stays under it: the fallback if the GPU context is lost */
    return true;
  }

  if (!VIDEO) {
    /* onload rather than decode(): a page that starts while the desktop is covered produces no frames yet */
    var load = function (u) { return new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = u; }); };
    Promise.all([load('__IMG__'), load('__DEPTH__')]).then(function (r) {
      iw = r[0].naturalWidth;
      ih = r[0].naturalHeight;
      upload(0, r[0], 1, 1);
      upload(1, r[1], 0, 0);
      upload(2, r[1], 0, 0);
      if (show()) kick();                /* the pointer may have moved while the picture loaded */
      return load('motion.png').then(function (m) {
        upload(3, m, 0, 0);
        MOTION = 1;
        kick();
      });
    }).catch(function () {});
    return;
  }

  /* ---- video: depth frames from __DEPTH__ ("SPDV", JPEGs, index, trailer: count, w, h, fps, index offset, "SPDV") */
  var buf = null, idx = null, count = 0, fps = 15, cache = {}, pending = {}, shownA = -1, shownB = -1;
  function bitmap(i) {                   /* the decoded depth frame i, or null while it decodes */
    i = Math.max(0, Math.min(count - 1, i));
    if (cache[i]) return cache[i];
    if (!pending[i]) {
      pending[i] = 1;
      var blob = new Blob([new Uint8Array(buf, idx[i * 2], idx[i * 2 + 1])], { type: 'image/jpeg' });
      /* WebGL ignores UNPACK_FLIP_Y for ImageBitmaps: they are flipped as they decode */
      createImageBitmap(blob, { imageOrientation: 'flipY', colorSpaceConversion: 'none' }).then(function (b) { delete pending[i]; cache[i] = b; trim(i); }, function () { delete pending[i]; });
    }
    return null;
  }
  function trim(keep) {                  /* a handful of decoded frames around the playhead, no more */
    for (var k in cache) if (Math.abs(k - keep) > 12 && Math.abs(k - keep) < count - 12) { cache[k].close(); delete cache[k]; }
  }
  function videoFrame(now, meta) {
    var t = meta && meta.mediaTime != null ? meta.mediaTime : vid.currentTime;
    if (!meta && t === lastT && !step(now)) { later(); return; }   /* display frames: draw only what changed */
    lastT = t;
    var f = t * fps, a = Math.floor(f) % count, b = (a + 1) % count;
    var A = bitmap(a), B = bitmap(b);
    for (var n = 2; n < 6; n++) bitmap((a + n) % count);    /* ahead of playback */
    if (A && a !== shownA) { upload(1, A, 0, 0); shownA = a; }
    if (B && b !== shownB) { upload(2, B, 0, 0); shownB = b; }
    if (shownA >= 0) {
      gl.uniform1f(U.F, B && shownB === b ? f - Math.floor(f) : 0);
      upload(0, vid, 1, 0);
      if (!ready) { iw = vid.videoWidth; ih = vid.videoHeight; if (!show()) return; }
      step(now);
      draw();
    }
    later();
  }
  /* One chain of frame callbacks. A freeze (Screen+ suspends the page while a fullscreen app runs) can pause
   * the video and drop a pending callback, so showing the page again plays the video and starts a new chain;
   * the generation number retires the old one if it does fire after all. */
  var lastT = -1, gen = 0, drawn = 0, raf = !vid.requestVideoFrameCallback;
  function later() {
    var g = gen;
    function cb(now, meta) { if (g === gen) { drawn = performance.now(); videoFrame(now, meta); } }
    if (raf) requestAnimationFrame(function (now) { cb(now, null); });
    else vid.requestVideoFrameCallback(cb);
  }
  /* Watchdog: a shown, playing video that has drawn nothing for a while has lost its frame callbacks; the
   * display's frames drive it until the video's own come back. */
  setInterval(function () {
    if (document.hidden || vid.paused || !count || performance.now() - drawn < 700) return;
    if (!raf && vid.requestVideoFrameCallback) {
      raf = 1;
      vid.requestVideoFrameCallback(function () { raf = 0; gen++; later(); });
    }
    gen++;
    later();
  }, 1000);
  function wake() {
    if (document.hidden || !count) return;
    if (vid.paused) vid.play().catch(function () { vid.muted = true; vid.play(); });
    gen++;
    later();
  }
  document.addEventListener('visibilitychange', wake);
  document.addEventListener('resume', wake);                   /* Page Lifecycle: after a freeze */
  vid.addEventListener('playing', wake);
  vid.addEventListener('pause', function () { if (!document.hidden) wake(); });   /* paused while shown: not by anyone's choice */
  fetch('__DEPTH__').then(function (r) { return r.arrayBuffer(); }).then(function (ab) {
    var dv = new DataView(ab), e = ab.byteLength;
    if (e < 32 || dv.getUint32(e - 4, true) !== 0x56445053) return;
    count = dv.getUint32(e - 24, true);
    fps = dv.getFloat32(e - 12, true);
    idx = new Uint32Array(ab.slice(dv.getUint32(e - 8, true), dv.getUint32(e - 8, true) + count * 8));
    buf = ab;
    if (!count || !(fps > 0)) return;
    bitmap(0);
    later();
  }).catch(function () {});
})();
</script>
