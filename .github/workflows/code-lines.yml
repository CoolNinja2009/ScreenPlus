name: Update code lines badge

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/code-lines.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count code lines
        shell: pwsh
        run: .\scripts\update-code-lines.ps1

      - name: Update badge data
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/code-lines.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Code line count is unchanged."
            exit 0
          }
          git commit -m "Update code lines badge"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
