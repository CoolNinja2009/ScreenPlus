# Builds Screen+ and publishes a GitHub release with the installer and a portable zip.
#
# Every push to main that changes the app gets a new version automatically:
#   - the next patch after the newest vX.Y.Z tag (v1.0.3 -> v1.0.4), or
#   - SCREENPLUS_VERSION from CMakeLists.txt when that is higher (bump it there for a
#     new minor/major version).
# Pushing a tag yourself (git tag v1.2.0 && git push --tags) releases exactly that version.
# Pull requests are built but not released.
#
# FFmpeg is compiled only once per revision of scripts/build-ffmpeg.sh: the result is kept as
# ffmpeg-<hash>.zip on the "deps" pre-release (never evicted, unlike the Actions cache), so a
# normal run downloads it in seconds instead of spending ~15 minutes compiling.
name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'installer/**'
      - 'samples/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'build.cmd'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'installer/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # tags are needed to pick the next version

      - name: Pick version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(sed -n 's/^set(SCREENPLUS_VERSION "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            latest="${latest#v}"
            if [[ -z "$latest" ]]; then
              ver="$base"
            elif [[ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -n1)" == "$base" && "$base" != "$latest" ]]; then
              ver="$base"
            else
              IFS=. read -r major minor patch <<< "$latest"
              ver="$major.$minor.$((patch + 1))"
            fi
          fi
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version '$ver' must be major.minor.patch"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building Screen+ $ver"

      - name: Download prebuilt FFmpeg
        id: ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = 'ffmpeg-' + '${{ hashFiles('scripts/build-ffmpeg.sh') }}'.Substring(0, 16)
          "key=$key" >> $env:GITHUB_OUTPUT
          gh release download deps --pattern "$key.zip" --dir $env:RUNNER_TEMP 2>$null
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive "$env:RUNNER_TEMP\$key.zip" -DestinationPath third_party -Force
            "hit=true" >> $env:GITHUB_OUTPUT
            Write-Host "Using prebuilt $key"
          } else {
            Write-Host "No prebuilt $key yet: building FFmpeg once"
          }
          exit 0

      - name: Set up MSYS2 (FFmpeg build)
        if: steps.ffmpeg.outputs.hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make diffutils tar xz curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.hit != 'true'
        shell: msys2 {0}
        run: bash ./scripts/build-ffmpeg.sh

      - name: Keep FFmpeg for later runs
        if: steps.ffmpeg.outputs.hit != 'true' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = '${{ steps.ffmpeg.outputs.key }}'
          Compress-Archive -Path third_party\ffmpeg -DestinationPath "$env:RUNNER_TEMP\$key.zip" -Force
          gh release view deps 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create deps --prerelease --title "Build dependencies (CI)" `
              --notes "Prebuilt LGPL FFmpeg used by the build workflow, produced by scripts/build-ffmpeg.sh. Not a Screen+ release."
          }
          gh release upload deps "$env:RUNNER_TEMP\$key.zip" --clobber

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      - name: Build app and installer
        shell: cmd
        run: call build.cmd Release ${{ steps.version.outputs.version }}

      # Code signing through SignPath Foundation (free for open source), so Defender and SmartScreen
      # trust the files instead of flagging an unknown unsigned exe. It runs once the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set (see .signpath/README.md):
      # the exes are signed first, setup is rebuilt around them, then setup itself is signed.
      - name: Upload exes for signing
        id: unsigned-bin
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-bin
          path: |
            build/ScreenPlus.exe
            build/ScreenPlus.com

      - name: Sign exes
        if: steps.unsigned-bin.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScreenPlus
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-bin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # release-signing waits for your approval
          output-artifact-directory: signed-bin

      - name: Rebuild setup around the signed exes
        if: steps.unsigned-bin.outcome == 'success'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          Copy-Item signed-bin\ScreenPlus.exe, signed-bin\ScreenPlus.com build\ -Force
          Copy-Item build\ScreenPlus.exe build\ScreenPlus.scr -Force
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /V2 "/DVERSION=$v" "/DSTAGE=$PWD\build" `
            "/DOUTFILE=$PWD\build\ScreenPlus-Setup-$v.exe" installer\screenplus.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Upload setup for signing
        id: unsigned-setup
        if: steps.unsigned-bin.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: build/ScreenPlus-Setup-${{ steps.version.outputs.version }}.exe

      - name: Sign setup
        if: steps.unsigned-setup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScreenPlus
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Use the signed setup
        if: steps.unsigned-setup.outcome == 'success'
        shell: pwsh
        run: Copy-Item signed-setup\*.exe build\ -Force

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $setup = "build\ScreenPlus-Setup-$v.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built: $setup" }
          $stage = 'dist\ScreenPlus'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\ScreenPlus.exe, build\*.dll $stage
          Copy-Item build\licenses, build\samples $stage -Recurse
          # Self-contained like the rest of the zip: the URL-import tools (yt-dlp + QuickJS-NG), fetched and
          # SHA-256 verified by the app's own downloader (versions pinned in src/common/webfetch.c).
          # The installer stays small: it downloads them during setup, when that component is chosen.
          $env:SCREENPLUS_DATA_DIR = "$env:RUNNER_TEMP\sp-data"
          & build\ScreenPlus.com tools install
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the URL-import tools" }
          Copy-Item "$env:SCREENPLUS_DATA_DIR\tools" $stage -Recurse
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $setup release\
          Copy-Item "build\ScreenPlus-$v-samples.zip" release\   # setup's optional download (screenplus samples install)
          Copy-Item "build\ScreenPlus-$v-samples.json" release\  # every sample file's SHA-256: the app's sample updates
          Compress-Archive -Path "$stage\*" -DestinationPath "release\ScreenPlus-$v-win-x64-portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenPlus-${{ steps.version.outputs.version }}
          path: release/*

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Screen+ ${tag#v}" --generate-notes
          fi
