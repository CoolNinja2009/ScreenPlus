# Builds Screen+ for Windows and Linux, validates Linux packages across distributions,
# then publishes one GitHub release after every build and install check passes.
#
# Every push to main that changes the app gets a new version automatically:
#   - the next patch after the newest vX.Y.Z tag (v1.0.3 -> v1.0.4), or
#   - SCREENPLUS_VERSION from CMakeLists.txt when that is higher (bump it there for a
#     new minor/major version).
# Pushing a tag yourself (git tag v1.2.0 && git push --tags) releases exactly that version.
# Pull requests are built but not released.
#
# FFmpeg is compiled only once per revision of scripts/build-ffmpeg.sh: the result is kept as
# ffmpeg-<hash>.zip on the "deps" pre-release (never evicted, unlike the Actions cache), so a
# normal run downloads it in seconds instead of spending ~15 minutes compiling.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'installer/**'
      - 'samples/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'build.cmd'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/**'
      - '.gitlab-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'installer/**'
      - 'CMakeLists.txt'
      - 'build.cmd'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.gitlab-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            if gh release view "v$ver" >/dev/null 2>&1; then
              echo "version=$ver" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            base=$(sed -n 's/^set(SCREENPLUS_VERSION "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' CMakeLists.txt)
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            latest="${latest#v}"
            if [[ -z "$latest" ]]; then
              ver="$base"
            elif [[ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -n1)" == "$base" && "$base" != "$latest" ]]; then
              ver="$base"
            else
              IFS=. read -r major minor patch <<< "$latest"
              ver="$major.$minor.$((patch + 1))"
            fi
          fi
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version '$ver'"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Building Screen+ $ver"

  windows:
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # tags are needed to pick the next version

      - name: Download prebuilt FFmpeg
        id: ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = 'ffmpeg-' + '${{ hashFiles('scripts/build-ffmpeg.sh') }}'.Substring(0, 16)
          "key=$key" >> $env:GITHUB_OUTPUT
          gh release download deps --pattern "$key.zip" --dir $env:RUNNER_TEMP 2>$null
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive "$env:RUNNER_TEMP\$key.zip" -DestinationPath third_party -Force
            "hit=true" >> $env:GITHUB_OUTPUT
            Write-Host "Using prebuilt $key"
          } else {
            Write-Host "No prebuilt $key yet: building FFmpeg once"
          }
          exit 0

      - name: Set up MSYS2 (FFmpeg build)
        if: steps.ffmpeg.outputs.hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make diffutils tar xz curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.hit != 'true'
        shell: msys2 {0}
        run: bash ./scripts/build-ffmpeg.sh

      - name: Keep FFmpeg for later runs
        if: steps.ffmpeg.outputs.hit != 'true' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = '${{ steps.ffmpeg.outputs.key }}'
          Compress-Archive -Path third_party\ffmpeg -DestinationPath "$env:RUNNER_TEMP\$key.zip" -Force
          gh release view deps 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create deps --prerelease --title "Build dependencies (CI)" `
              --notes "Prebuilt LGPL FFmpeg used by the build workflow, produced by scripts/build-ffmpeg.sh. Not a Screen+ release."
          }
          gh release upload deps "$env:RUNNER_TEMP\$key.zip" --clobber

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      - name: Build app and installer
        shell: cmd
        run: call build.cmd Release ${{ needs.version.outputs.version }}

      # Code signing through SignPath Foundation (free for open source), so Defender and SmartScreen
      # trust the files instead of flagging an unknown unsigned exe. It runs once the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set (see .signpath/README.md):
      # the exes are signed first, setup is rebuilt around them, then setup itself is signed.
      - name: Upload exes for signing
        id: unsigned-bin
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-bin
          path: |
            build/ScreenPlus.exe
            build/ScreenPlus.com

      - name: Sign exes
        if: steps.unsigned-bin.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScreenPlus
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-bin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # release-signing waits for your approval
          output-artifact-directory: signed-bin

      - name: Rebuild setup around the signed exes
        if: steps.unsigned-bin.outcome == 'success'
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          Copy-Item signed-bin\ScreenPlus.exe, signed-bin\ScreenPlus.com build\ -Force
          Copy-Item build\ScreenPlus.exe build\ScreenPlus.scr -Force
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /V2 "/DVERSION=$v" "/DSTAGE=$PWD\build" `
            "/DOUTFILE=$PWD\build\ScreenPlus-Setup-$v.exe" installer\screenplus.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Upload setup for signing
        id: unsigned-setup
        if: steps.unsigned-bin.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: build/ScreenPlus-Setup-${{ needs.version.outputs.version }}.exe

      - name: Sign setup
        if: steps.unsigned-setup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScreenPlus
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Use the signed setup
        if: steps.unsigned-setup.outcome == 'success'
        shell: pwsh
        run: Copy-Item signed-setup\*.exe build\ -Force

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $setup = "build\ScreenPlus-Setup-$v.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built: $setup" }
          $stage = 'dist\ScreenPlus'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\ScreenPlus.exe, build\*.dll $stage
          Copy-Item build\licenses, build\samples $stage -Recurse
          # Self-contained like the rest of the zip: the URL-import tools (yt-dlp + QuickJS-NG), fetched and
          # SHA-256 verified by the app's own downloader (versions pinned in src/common/webfetch.c).
          # The installer stays small: it downloads them during setup, when that component is chosen.
          $env:SCREENPLUS_DATA_DIR = "$env:RUNNER_TEMP\sp-data"
          & build\ScreenPlus.com tools install
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the URL-import tools" }
          Copy-Item "$env:SCREENPLUS_DATA_DIR\tools" $stage -Recurse
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $setup release\
          Copy-Item "build\ScreenPlus-$v-samples.zip" release\   # setup's optional download (screenplus samples install)
          Copy-Item "build\ScreenPlus-$v-samples.json" release\  # every sample file's SHA-256: the app's sample updates
          Compress-Archive -Path "$stage\*" -DestinationPath "release\ScreenPlus-$v-win-x64-portable.zip"
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  arch:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build on Arch Linux
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$GITHUB_WORKSPACE:/workspace" -w /workspace archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed base-devel cmake ninja pkgconf sdl3 cairo pango fontconfig gtk4 gtk4-layer-shell mpv webkitgtk-6.0 libepoxy wayland wayland-protocols ffmpeg
            bash scripts/gitlab-linux.sh build
          '
  debian:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$GITHUB_WORKSPACE:/workspace" -w /workspace debian:13 bash -lc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates build-essential cmake ninja-build pkg-config dpkg-dev libcairo2-dev libpango1.0-dev libfontconfig-dev libgtk-4-dev libmpv-dev libwebkitgtk-6.0-dev libepoxy-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libsdl3-dev libgtk4-layer-shell-dev
            bash scripts/gitlab-linux.sh deb debian
          '
      - uses: actions/upload-artifact@v4
        with:
          name: release-debian
          path: release/*

  ubuntu:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore Ubuntu native library build cache
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg-own/
            libs-own/
          key: linux-ubuntu-${{ hashFiles('scripts/build-ffmpeg-linux.sh', 'scripts/build-libs-linux.sh') }}
      - name: Build Ubuntu package and portable Linux tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ubuntu:24.04 bash -lc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates build-essential cmake ninja-build pkg-config dpkg-dev libcairo2-dev libpango1.0-dev libfontconfig-dev libgtk-4-dev libmpv-dev libwebkitgtk-6.0-dev libepoxy-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev meson patchelf curl xz-utils nasm libdav1d-dev zlib1g-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libdecor-0-dev libdbus-1-dev
            bash scripts/gitlab-linux.sh deb ubuntu
          '
      - uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu
          path: release/*

  fedora:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore Fedora FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-own/
          key: linux-fedora-${{ hashFiles('scripts/build-ffmpeg-linux.sh') }}
      - name: Build Fedora RPM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$GITHUB_WORKSPACE:/workspace" -w /workspace fedora:44 bash -lc '
            dnf install -y gcc cmake ninja-build pkgconf-pkg-config rpm-build make nasm xz patchelf "pkgconfig(dav1d)" "pkgconfig(zlib)" "pkgconfig(sdl3)" "pkgconfig(cairo)" "pkgconfig(pangocairo)" "pkgconfig(fontconfig)" "pkgconfig(gtk4)" "pkgconfig(gtk4-layer-shell-0)" "pkgconfig(webkitgtk-6.0)" "pkgconfig(mpv)" "pkgconfig(epoxy)"
            bash scripts/gitlab-linux.sh rpm
          '
      - uses: actions/upload-artifact@v4
        with:
          name: release-fedora
          path: release/*

  ubuntu-newest:
    needs: [version, ubuntu]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-ubuntu
          path: release
      - name: Install Ubuntu package on newest Ubuntu
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$GITHUB_WORKSPACE:/workspace" -w /workspace ubuntu:26.04 bash -lc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ./release/ScreenPlus-$VERSION-ubuntu-amd64.deb
            screenplus version | grep -F "$VERSION"
            screenplus help >/dev/null
            if ldd /usr/lib/screenplus/screenplus-ui.so /usr/lib/screenplus/screenplus-engine /usr/lib/screenplus/screenplus-depth.so | grep "not found"; then exit 1; fi
          '

  install-test:
    needs: [version, ubuntu]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
          - distro: fedora
            image: fedora:44
          - distro: opensuse
            image: opensuse/tumbleweed:latest
          - distro: debian
            image: debian:13
          - distro: ubuntu
            image: ubuntu:26.04
          - distro: neon
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-ubuntu
          path: release
      - name: Test portable tarball installer on ${{ matrix.distro }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "${{ matrix.image }}" bash -lc '
            sh scripts/gitlab-install-test.sh "${{ matrix.distro }}"
          '

  publish:
    needs: [version, windows, arch, debian, ubuntu, fedora, ubuntu-newest, install-test]
    if: needs.version.outputs.skip != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: release-debian
          path: release
      - name: Download Ubuntu package and Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: release-ubuntu
          path: release
      - name: Download Fedora RPM
        uses: actions/download-artifact@v4
        with:
          name: release-fedora
          path: release
      - name: Create checksums and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          tag="v$VERSION"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Screen+ $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
