# Builds Screen+ for Linux on GitLab's own machines and releases every push to cross-platform as the next
# 2.0.N-beta: nothing runs on, or lands on, the developer's PC. The work is in scripts/gitlab-linux.sh.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "cross-platform" && $CI_PIPELINE_SOURCE == "push"

linux:
  image: archlinux:latest
  tags: [saas-linux-small-amd64]
  timeout: 1h
  variables:
    GIT_DEPTH: "0"              # tags are needed to pick the next version
  script:
    - pacman -Syu --noconfirm --needed base-devel git curl cmake ninja pkgconf sdl3 cairo pango fontconfig gtk4 gtk4-layer-shell mpv webkitgtk-6.0 libepoxy wayland wayland-protocols ffmpeg
    - bash scripts/gitlab-linux.sh
  artifacts:
    paths: [release/]
    expire_in: 7 days
