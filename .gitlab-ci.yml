# Builds Screen+ for Windows and Linux and publishes them as one GitLab release: the Windows installer, a
# portable zip and the samples (on the runner on the developer's PC, unsigned: SignPath runs on GitHub only),
# and a tar.gz for any distribution with an install.sh that installs what is missing (built with the Ubuntu .deb), a
# .deb each for Debian and Ubuntu (24.04 and newer) and an .rpm from Fedora (on GitLab's machines).
# Every push to main gets the next version, a vX.Y.Z tag releases that exact version, merge requests are built
# but not released. Nothing is released unless every build passes. Like .github/workflows/release.yml
# (Windows only).
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &app
        - src/**/*
        - resources/**/*
        - installer/**/*
        - samples/**/*
        - scripts/**/*
        - CMakeLists.txt
        - build.cmd
        - LICENSE
        - THIRD_PARTY_NOTICES.md
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

stages: [version, build, release]

# The Windows build runs on the runner on the developer's PC. For GitLab's own Windows machines instead,
# start a pipeline by hand with BUILD_RUNNER set to saas-windows-medium-amd64.
variables:
  BUILD_RUNNER: screenplus-pc

default:
  tags: [saas-linux-small-amd64]

# VERSION for every job: the tag's in a tag pipeline, else the next patch after the newest vX.Y.Z tag, or the
# CMakeLists.txt version when that is higher. SKIP=1 when the tag is already released (publishing a release
# creates its tag, which starts a tag pipeline with nothing left to do).
version:
  stage: version
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"              # tags are needed to pick the next version
  script:
    - apk add --no-cache git curl coreutils
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - sh scripts/gitlab-version.sh > version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

windows:
  stage: build
  needs: [version]
  tags: [$BUILD_RUNNER]
  timeout: 2h
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
    GIT_CONFIG_COUNT: "1"       # keep LF: build-ffmpeg.sh must run in bash, and samples are hashed
    GIT_CONFIG_KEY_0: core.autocrlf
    GIT_CONFIG_VALUE_0: "false"
  script:
    - if ($env:SKIP -eq '1') { exit 0 }
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\gitlab-release.ps1
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    paths: [release/]
    expire_in: 3 days

.linux:
  stage: build
  needs: [version]
  timeout: 1h
  variables:
    GIT_DEPTH: "1"
  artifacts:
    paths: [release/]
    expire_in: 3 days

.apt: &apt
  - export DEBIAN_FRONTEND=noninteractive
  - apt-get update
  - apt-get install -y --no-install-recommends ca-certificates build-essential cmake ninja-build pkg-config dpkg-dev libcairo2-dev libpango1.0-dev libfontconfig-dev libgtk-4-dev libmpv-dev libwebkitgtk-6.0-dev libepoxy-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

arch:
  extends: .linux
  image: archlinux:latest
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - pacman -Syu --noconfirm --needed base-devel cmake ninja pkgconf sdl3 cairo pango fontconfig gtk4 gtk4-layer-shell mpv webkitgtk-6.0 libepoxy wayland wayland-protocols ffmpeg
    - bash scripts/gitlab-linux.sh build          # newest compiler and libraries; the tarball comes from the ubuntu job

debian:
  extends: .linux
  image: debian:13
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - *apt
    - apt-get install -y --no-install-recommends libsdl3-dev libgtk4-layer-shell-dev
    - bash scripts/gitlab-linux.sh deb debian

# Built on 24.04, the oldest Ubuntu still supported and KDE neon's base, so it installs on every newer one too. 24.04
# has no SDL3, gtk4-layer-shell or FFmpeg 8: the package carries its own (scripts/build-libs-linux.sh, build-ffmpeg-linux.sh).
# The tarball is packed from the same tree, so it runs on any glibc 2.39+ distribution.
ubuntu:
  extends: .linux
  image: ubuntu:24.04
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - *apt
    - apt-get install -y --no-install-recommends meson patchelf curl xz-utils nasm libdav1d-dev zlib1g-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libdecor-0-dev libdbus-1-dev
    - bash scripts/gitlab-linux.sh deb ubuntu

# The same .deb on the newest Ubuntu
ubuntu-newest:
  stage: build
  needs: [version, ubuntu]
  image: ubuntu:26.04
  variables:
    GIT_STRATEGY: none
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends ./release/ScreenPlus-$VERSION-ubuntu-amd64.deb
    - screenplus version | grep -F "$VERSION"
    - screenplus help > /dev/null
    - if ldd /usr/lib/screenplus/screenplus-ui.so /usr/lib/screenplus/screenplus-engine /usr/lib/screenplus/screenplus-depth.so | grep 'not found'; then exit 1; fi

# The tarball's install.sh on bare images: it must install what each distribution lacks (scripts/gitlab-install-test.sh)
install-test:
  stage: build
  needs: [version, ubuntu]
  image: $IMAGE
  variables:
    GIT_DEPTH: "1"
  parallel:
    matrix:
      - { DISTRO: arch, IMAGE: "archlinux:latest" }
      - { DISTRO: fedora, IMAGE: "fedora:latest" }
      - { DISTRO: opensuse, IMAGE: "opensuse/tumbleweed:latest" }
      - { DISTRO: debian, IMAGE: "debian:13" }
      - { DISTRO: ubuntu, IMAGE: "ubuntu:26.04" }
      - { DISTRO: neon, IMAGE: "ubuntu:24.04" }
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - sh scripts/gitlab-install-test.sh $DISTRO

# Built on the oldest Fedora still supported, so glibc's symbols suit the newer ones; it carries its own FFmpeg.
fedora:
  extends: .linux
  image: fedora:44
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - dnf install -y gcc cmake ninja-build pkgconf-pkg-config rpm-build make nasm xz patchelf 'pkgconfig(dav1d)' 'pkgconfig(zlib)' 'pkgconfig(sdl3)' 'pkgconfig(cairo)' 'pkgconfig(pangocairo)' 'pkgconfig(fontconfig)' 'pkgconfig(gtk4)' 'pkgconfig(gtk4-layer-shell-0)' 'pkgconfig(webkitgtk-6.0)' 'pkgconfig(mpv)' 'pkgconfig(epoxy)'
    - bash scripts/gitlab-linux.sh rpm

release:
  stage: release
  image: alpine:latest
  needs: [version, windows, arch, debian, ubuntu, ubuntu-newest, install-test, fedora]
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  variables:
    GIT_DEPTH: "1"
  script:
    - if [ "$SKIP" = 1 ]; then exit 0; fi
    - apk add --no-cache curl coreutils
    - sh scripts/gitlab-publish.sh

# Leaves nothing on the developer's PC: runs after everything, whether or not the build passed. GitLab's own
# machines are thrown away after each job, so they don't need it.
clean:
  stage: .post
  tags: [$BUILD_RUNNER]
  rules:
    - if: $BUILD_RUNNER == "screenplus-pc"
      when: always
  variables:
    GIT_STRATEGY: none
  dependencies: []              # don't download release/ again
  script:
    - Get-ChildItem $env:CI_PROJECT_DIR -Force | Remove-Item -Recurse -Force
    # Test-Path, not -ErrorAction SilentlyContinue: a missing path still leaves $? false, and the job fails
    - foreach ($p in @("$env:TEMP\ffmpeg-*.zip", "$env:TEMP\sp-data")) { if (Test-Path $p) { Remove-Item $p -Recurse -Force } }
