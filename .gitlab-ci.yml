# Builds Screen+ and publishes a GitLab release with the installer and a portable zip.
# Like .github/workflows/release.yml, but every push to main gets the next
# version, a vX.Y.Z tag releases that exact version, and merge requests are built but not released.
# The work is in scripts/gitlab-release.ps1. Builds run on the runner on the developer's PC, so that has
# to be running. They are not signed (SignPath runs on GitHub only).
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &app
        - src/**/*
        - resources/**/*
        - installer/**/*
        - samples/**/*
        - scripts/**/*
        - CMakeLists.txt
        - build.cmd
        - LICENSE
        - THIRD_PARTY_NOTICES.md
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

# The runner on the developer's PC. For GitLab's own Windows machines instead, start a pipeline by hand
# with BUILD_RUNNER set to saas-windows-medium-amd64.
variables:
  BUILD_RUNNER: screenplus-pc

build:
  tags: [$BUILD_RUNNER]
  timeout: 2h
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"              # tags are needed to pick the next version
    GIT_CONFIG_COUNT: "1"       # keep LF: build-ffmpeg.sh must run in bash, and samples are hashed
    GIT_CONFIG_KEY_0: core.autocrlf
    GIT_CONFIG_VALUE_0: "false"
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\gitlab-release.ps1
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    paths: [release/]
    expire_in: 3 days
